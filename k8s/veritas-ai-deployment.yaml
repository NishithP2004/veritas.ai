apiVersion: apps/v1
kind: Deployment
metadata:
  name: veritas-ai
spec:
  replicas: 3
  selector:
    matchLabels:
      app: veritas-ai
  template:
    metadata:
      labels:
        app: veritas-ai
    spec:
      initContainers:
        - name: wait-for-kafka
          image: busybox
          imagePullPolicy: IfNotPresent
          command: ['sh', '-c', 'until nc -z kafka 9092; do echo "Waiting for Kafka..."; sleep 5; done']
      containers:
        - name: veritas-ai
          image: nishithp/veritas-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: veritas-ai-secrets
                  key: PORT
            - name: MONGO_CONNECTION_URL
              valueFrom:
                secretKeyRef:
                  name: veritas-ai-secrets
                  key: MONGO_CONNECTION_URL
            - name: MONGO_DB_NAME
              valueFrom:
                secretKeyRef:
                  name: veritas-ai-secrets
                  key: MONGO_DB_NAME
            - name: OLLAMA_NUM_PARALLEL
              valueFrom:
                secretKeyRef:
                  name: veritas-ai-secrets
                  key: OLLAMA_NUM_PARALLEL
            - name: G_SEARCH_KEY
              valueFrom:
                secretKeyRef:
                  name: veritas-ai-secrets
                  key: G_SEARCH_KEY
            - name: G_CX
              valueFrom:
                secretKeyRef:
                  name: veritas-ai-secrets
                  key: G_CX
            - name: OLLAMA_HOST
              valueFrom:
                secretKeyRef:
                  name: veritas-ai-secrets
                  key: OLLAMA_HOST